<style>
@layer base{
  html,body{width:100vw;margin:0;padding:0;background-color:#131318;}
  body{overscroll-behavior:none;min-height:max(884px,100dvh);}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}
  .pt-safe{padding-top:env(safe-area-inset-top,0px);}
}
::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}
.fade-in{animation:fadeIn .25s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.toast-in{animation:toastIn .25s ease both;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.progress-fill{transition:width .4s ease;}
.icon-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.icon-wrap .icon-img{display:block;width:100%;height:100%;object-fit:contain;opacity:.65;transition:opacity .2s,filter .2s;}
.icon-wrap.icon-active .icon-img{opacity:1;filter:drop-shadow(0 0 6px rgba(255,72,152,.7));}
.icon-wrap .fallback-icon{display:none;}
.icon-wrap.icon-fallback .fallback-icon{display:inline-flex;}
.icon-wrap.icon-fallback .icon-img{display:none;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9999px;background:rgba(255,255,255,.08);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:9999px;background:#ffb0c9;box-shadow:0 0 10px rgba(255,176,201,.6);cursor:pointer;}
.toggle-track{width:40px;height:22px;border-radius:9999px;background:rgba(255,255,255,.08);position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;}
.toggle-track.on{background:#ff1f8f;}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9999px;background:#e4e1e9;transition:left .2s;}
.toggle-track.on .toggle-knob{left:20px;background:#fff;}

/* ============ HELPERS ============ */
function fmtKg(kg){
  if(state.settings.unit === 'lbs') return (kg*2.20462).toFixed(1)+' lbs';
  return kg+' kg';
}
function fmtWeightNum(kg){
  return state.settings.unit === 'lbs' ? Math.round(kg*2.20462*10)/10 : kg;
}
function pad(n){ return n.toString().padStart(2,'0'); }
function fmtHMS(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function fmtMS(sec){
  sec = Math.max(0,sec);
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return `${pad(m)}:${pad(s)}`;
}
function toast(msg, icon){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast-in pointer-events-auto flex items-center gap-element-margin bg-surface-container-highest/95 backdrop-blur-md border border-white/10 text-on-surface px-widget-padding py-widget-padding rounded-lg shadow-xl max-w-full';
  el.innerHTML = `<span class="material-symbols-outlined text-[18px] text-primary">${icon||'check_circle'}</span><span class="font-label-md text-label-md">${msg}</span>`;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(10px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function openModal(inner){
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" data-action="modal-backdrop">
      <div class="w-full sm:max-w-sm bg-surface-container-low rounded-t-xl sm:rounded-xl p-card-padding shadow-2xl border border-white/10 fade-in" data-action="modal-noop">
        ${inner}
      </div>
    </div>`;
}
function openConfirm(title, body, confirmLabel, action, danger){
  openModal(`
    <h3 class="font-headline-md text-headline-md text-on-surface mb-element-margin">${title}</h3>
    <p class="font-body-md text-body-md text-on-surface-variant mb-card-padding">${body}</p>

      <button data-action="${action}" class="py-widget-padding rounded-lg ${danger ? 'bg-error text-on-error' : 'bg-primary text-on-primary'} font-label-md font-semibold">${confirmLabel}</button>
    </div>`);
}
function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ============ AUTH (écran identique à LISTMAX / CREAFOOD) ============ */
let authAccounts = []; // comptes de démonstration en mémoire (aucun vrai backend)
let currentEmail = null;
let authMode = 'login';

function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return 'h'+h; }

function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('app-main').classList.remove('hidden');
  document.getElementById('app-main').classList.add('flex');
  document.getElementById('app-nav').classList.remove('hidden');
}
function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-header').classList.add('hidden');
  document.getElementById('app-main').classList.add('hidden');
  document.getElementById('app-main').classList.remove('flex');
  document.getElementById('app-nav').classList.add('hidden');
  setAuthMode('login');
  document.getElementById('auth-form').reset();
  hideAuthError();
}

function initAuthUI(){
  document.getElementById('tab-login').addEventListener('click', () => setAuthMode('login'));
  document.getElementById('tab-signup').addEventListener('click', () => setAuthMode('signup'));
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('auth-password');
    const btn = document.getElementById('toggle-pw');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    btn.querySelector('span').textContent = show ? 'visibility_off' : 'visibility';
  });
  document.getElementById('auth-form').addEventListener('submit', handleAuthSubmit);
  document.getElementById('btn-google').addEventListener('click', handleGoogleAuth);
}
function setAuthMode(mode){
  authMode = mode;
  const loginTab = document.getElementById('tab-login');
  const signupTab = document.getElementById('tab-signup');
  loginTab.classList.toggle('bg-primary-container', mode==='login');
  loginTab.classList.toggle('text-on-primary-container', mode==='login');
  loginTab.classList.toggle('font-semibold', mode==='login');
  loginTab.classList.toggle('text-on-surface-variant', mode!=='login');
  signupTab.classList.toggle('bg-primary-container', mode==='signup');
  signupTab.classList.toggle('text-on-primary-container', mode==='signup');
  signupTab.classList.toggle('font-semibold', mode==='signup');
  signupTab.classList.toggle('text-on-surface-variant', mode!=='signup');
  document.getElementById('auth-name').classList.toggle('hidden', mode!=='signup');
  document.getElementById('auth-title').textContent = mode==='login' ? 'Bon retour' : 'Créer un compte';
  document.getElementById('auth-subtitle').textContent = mode==='login' ? 'Connecte-toi pour retrouver tes séances, ton planning et ton suivi corporel.' : 'Crée ton compte pour commencer à structurer ton entraînement.';
  document.getElementById('auth-submit').textContent = mode==='login' ? 'Se connecter' : 'Créer mon compte';
  hideAuthError();
}
function showAuthError(msg){ const e = document.getElementById('auth-error'); e.textContent = msg; e.classList.remove('hidden'); }
function hideAuthError(){ document.getElementById('auth-error').classList.add('hidden'); }

function loginAs(account){
  currentEmail = account.email;
  state.settings.name = account.name;
  state.settings.email = account.email;
  showApp();
  renderAll();
  setTab('home');
  toast('Bienvenue, ' + account.name.split(' ')[0] + ' !', 'celebration');
}

function handleAuthSubmit(e){
  e.preventDefault();
  hideAuthError();
  const email = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const name = document.getElementById('auth-name').value.trim();
  if(!email || !password){ showAuthError('Merci de remplir tous les champs.'); return; }
  if(authMode === 'signup'){
    if(!name){ showAuthError("Merci d'indiquer ton nom."); return; }
    if(password.length < 4){ showAuthError('Le mot de passe doit faire au moins 4 caractères.'); return; }
    if(authAccounts.find(a => a.email === email)){ showAuthError('Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.'); return; }
    const account = { name, email, passwordHash: simpleHash(password) };
    authAccounts.push(account);
    loginAs(account);
  } else {
    const account = authAccounts.find(a => a.email === email);
    if(!account || account.passwordHash !== simpleHash(password)){ showAuthError('E-mail ou mot de passe incorrect.'); return; }
    loginAs(account);
  }
}

function handleGoogleAuth(){
  openModal(`
    <div class="text-center py-2">
      <h3 class="font-headline-md text-headline-md text-on-surface mb-1">Connexion Google</h3>
      <p class="font-body-md text-body-md text-on-surface-variant mb-4">Aucune vraie authentification Google n'est reliée à ce prototype : indique le nom et l'e-mail du compte à utiliser pour simuler la connexion.</p>
      <div class="flex flex-col gap-3 text-left">
        <input id="g-auth-name" type="text" placeholder="Nom complet" class="w-full bg-surface-container-highest/60 border border-white/10 rounded-xl px-3.5 py-3 outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary"/>
        <input id="g-auth-email" type="email" placeholder="prenom.nom@gmail.com" class="w-full bg-surface-container-highest/60 border border-white/10 rounded-xl px-3.5 py-3 outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary"/>
      </div>
      <button id="g-auth-confirm" class="mt-4 w-full py-3.5 rounded-xl bg-primary text-on-primary font-headline-md text-headline-md font-semibold active:scale-[0.98] transition-all">Continuer</button>
    </div>`);
  document.getElementById('g-auth-confirm').addEventListener('click', () => {
    const name = document.getElementById('g-auth-name').value.trim();
    const email = document.getElementById('g-auth-email').value.trim().toLowerCase();
    if(!name || !email){ toast('Nom et e-mail requis'); return; }
    let account = authAccounts.find(a => a.email === email);
    if(!account){ account = { name, email, passwordHash: null }; authAccounts.push(account); }
    closeModal();
    loginAs(account);
  });
}

/* ============ NAV / TAB SWITCH ============ */
const tabTitles = { home:'Home', workout:'Workout', body:'Body Graph', planner:'Planner', settings:'Settings' };
function renderNav(){
  const iconFile = { home:'nav-home', workout:'nav-workout', body:'nav-body', planner:'nav-planning', settings:'nav-settings' };
  document.querySelectorAll('.nav-item').forEach(item=>{
    const t = item.dataset.tab;
    const active = state.tab === t;
    item.className = 'nav-item group flex flex-col items-center justify-center flex-1 h-full min-w-[56px] transition-colors ' + (active ? 'text-primary-container font-semibold' : 'text-on-surface-variant hover:text-on-surface');
    item.innerHTML = `<span class="icon-wrap w-6 h-6 ${active?'icon-active':''}">
        <img src="assets/icones/${iconFile[t]}.svg" class="icon-img" alt="${item.dataset.label}" onerror="this.parentElement.classList.add('icon-fallback');"/>
        <span class="material-symbols-outlined fallback-icon text-[24px]">${item.dataset.icon}</span>
      </span><span class="font-label-sm text-label-sm tracking-tight mt-tight-margin">${item.dataset.label}</span><span class="w-1.5 h-1.5 rounded-full mt-tight-margin ${active?'bg-primary-container shadow-[0_0_8px_rgba(255,72,152,0.9)]':'opacity-0'}"></span>`;
  });
  document.getElementById('header-subtitle').textContent = tabTitles[state.tab];
}
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+tab).classList.remove('hidden');
  document.getElementById('view-'+tab).classList.remove('fade-in'); void document.getElementById('view-'+tab).offsetWidth; document.getElementById('view-'+tab).classList.add('fade-in');
  renderNav();
  renderAll();
  window.scrollTo(0,0);
}
function renderAll(){
  renderHome(); renderWorkout(); renderBody(); renderPlanner(); renderSettings(); renderNav();
}

/* ============ WORKOUT LOGIC ============ */
function startWorkoutFor(dayIndex){
  const day = state.week.days[dayIndex];
  const template = sessionTemplates[day.label];
  if(!template || !template.length){ toast('Jour de repos — aucune séance planifiée.', 'bedtime'); return; }
  if(day.done){ toast("Séance déjà validée aujourd'hui.", 'info'); return; }
  state.workout.active = true;
  state.workout.finished = false;
  state.workout.paused = false;
  state.workout.sessionLabel = day.label;
  state.workout.exercises = JSON.parse(JSON.stringify(template));
  state.workout.exIndex = 0;
  state.workout.setIndex = 0;
  state.workout.elapsedSec = 0;
  state.workout.restRemaining = 0;
  state.workout.restTotal = 0;
  state.workout.restRunning = false;
  state.workout.weight = 20;
  state.workout.reps = typeof template[0].reps === 'number' ? template[0].reps : 8;
  state.workout.setLog = [];
  state.week.activeDayIndex = dayIndex;
  setTab('workout');
  toast('Séance "' + day.label + '" démarrée !', 'play_circle');
}
function validateSet(){
  const w = state.workout;
  const ex = w.exercises[w.exIndex];
  w.setLog.push({exIndex: w.exIndex, weight: w.weight, reps: w.reps});
  w.log.push({exercise: ex.name, weight: w.weight, reps: w.reps, ts: Date.now()});
  w.setIndex++;
  if(w.setIndex >= ex.sets){
    w.exIndex++;
    w.setIndex = 0;
    if(w.exIndex >= w.exercises.length){
      finishWorkout();
      return;
    }
    const nextEx = w.exercises[w.exIndex];
    w.reps = typeof nextEx.reps === 'number' ? nextEx.reps : 8;
    w.restRemaining = nextEx.rest || state.settings.restAuto;
    w.restTotal = w.restRemaining;
    w.restRunning = true;
    toast('Exercice suivant : ' + nextEx.name, 'skip_next');
  } else {
    w.restRemaining = ex.rest || state.settings.restAuto;
    w.restTotal = w.restRemaining;
    w.restRunning = true;
    toast('Série enregistrée !', 'check_circle');
  }
  renderWorkout();
}
function finishWorkout(){
  const w = state.workout;
  w.active = false;
  w.finished = true;
  w.restRunning = false;
  const totalVolume = w.setLog.reduce((a,s)=>a+s.weight*s.reps,0);
  state.monthly.tonnage = +(state.monthly.tonnage + totalVolume/1000).toFixed(1);
  state.monthly.sessions = Math.min(state.monthly.sessionsGoal, state.monthly.sessions+1);
  state.monthly.streak += 1;
  state.daily.volume = +(state.daily.volume + totalVolume/1000).toFixed(1);
  state.daily.score = Math.min(100, state.daily.score + 4);
  if(state.week.activeDayIndex !== undefined) state.week.days[state.week.activeDayIndex].done = true;
  renderWorkout();
}

/* ============ TIMER LOOP ============ */
setInterval(()=>{
  const w = state.workout;
  if(w.active && !w.paused){
    w.elapsedSec++;
    if(w.restRunning){
      w.restRemaining--;
      if(w.restRemaining<=0){ w.restRemaining=0; w.restRunning=false; }
    }
    if(state.tab==='workout') renderWorkout();
  }
}, 1000);

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', (e)=>{
  const navItem = e.target.closest('.nav-item');
  if(navItem){ setTab(navItem.dataset.tab); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const value = el.dataset.value;

  switch(action){
    case 'go-settings': setTab('settings'); break;
    case 'go-planner': setTab('planner'); break;
    case 'open-notifs':
      openModal(`<h3 class="font-headline-md text-headline-md text-on-surface mb-card-padding">Notifications</h3>
        <div class="flex flex-col gap-element-margin">
          <div class="flex items-start gap-element-margin"><span class="material-symbols-outlined text-primary text-[18px]">military_tech</span><p class="font-body-md text-body-md text-on-surface-variant">Nouveau record battu au développé couché — 62.5kg × 5 !</p></div>
          <div class="flex items-start gap-element-margin"><span class="material-symbols-outlined text-tertiary text-[18px]">event</span><p class="font-body-md text-body-md text-on-surface-variant">Ta séance Push B est prévue aujourd'hui à 17:30.</p></div>
          <div class="flex items-start gap-element-margin"><span class="material-symbols-outlined text-secondary text-[18px]">smart_toy</span><p class="font-body-md text-body-md text-on-surface-variant">Le Coach IA a analysé ton sommeil : priorise la récupération ce soir.</p></div>
        </div>
        <button data-action="modal-cancel" class="w-full mt-card-padding py-widget-padding rounded-lg bg-surface-container-high text-on-surface font-label-md font-semibold">Fermer</button>`);
      break;
    case 'ask-coach': toast('Le Coach IA prépare une réponse personnalisée…', 'smart_toy'); break;

    /* Home */
    case 'start-workout': startWorkoutFor(state.week.todayIndex); break;

    /* Workout */
    case 'toggle-pause': state.workout.paused = !state.workout.paused; toast(state.workout.paused?'Séance en pause':'Séance reprise'); renderWorkout(); break;
    case 'add-exercise':
      state.workout.exercises.push({name:'Exercice additionnel', sets:3, reps:12, rest:60});
      toast('Exercice ajouté à la séance', 'add_circle'); renderWorkout(); break;
    case 'confirm-finish':
      openConfirm('Terminer la séance ?', "Les exercices restants ne seront pas comptabilisés. Confirmer la fin de l'entraînement ?", 'Terminer', 'do-finish', true);
      break;
    case 'do-finish': closeModal(); finishWorkout(); break;
    case 'ack-finish': state.workout.finished = false; setTab('home'); toast('Séance enregistrée. Bravo !', 'celebration'); break;
    case 'rest-add30': state.workout.restRemaining += 30; state.workout.restTotal += 30; renderWorkout(); break;
    case 'rest-minus15': state.workout.restRemaining = Math.max(0, state.workout.restRemaining-15); renderWorkout(); break;
    case 'rest-skip': state.workout.restRemaining = 0; state.workout.restRunning = false; renderWorkout(); break;
    case 'weight-minus': state.workout.weight = Math.max(0, +(state.workout.weight - state.settings.increment*2).toFixed(2)); renderWorkout(); break;
    case 'weight-plus': state.workout.weight = +(state.workout.weight + state.settings.increment*2).toFixed(2); renderWorkout(); break;
    case 'reps-minus': state.workout.reps = Math.max(1, state.workout.reps-1); renderWorkout(); break;
    case 'reps-plus': state.workout.reps++; renderWorkout(); break;
    case 'validate-set': validateSet(); break;

    /* Body */
    case 'body-tab': state.bodyTab = value; renderBody(); break;
    case 'open-fatigue-test':
      openModal(`<h3 class="font-headline-md text-headline-md text-on-surface mb-element-margin">Test de fatigue du jour</h3>
        <p class="font-body-md text-body-md text-on-surface-variant mb-card-padding">Évalue ton niveau de fatigue perçue (1 = frais, 10 = épuisé).</p>
        <input id="fatigue-range" type="range" min="1" max="10" value="5"/>
        <div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant mt-tight-margin mb-card-padding"><span>1</span><span id="fatigue-val" class="text-on-surface font-bold">5</span><span>10</span></div>
        <button data-action="submit-fatigue" class="w-full py-widget-padding rounded-lg bg-primary text-on-primary font-label-md font-semibold">Valider</button>`);
      document.getElementById('fatigue-range').addEventListener('input', (ev)=>{ document.getElementById('fatigue-val').textContent = ev.target.value; });
      break;
    case 'submit-fatigue': {
      const v = +document.getElementById('fatigue-range').value;
      state.daily.fatigueTest = v;
      state.daily.recovery = Math.max(40, 100 - v*6);
      closeModal(); renderBody(); renderHome();
      toast('Fatigue enregistrée : ' + v + '/10', 'thermostat');
      break;
    }

    /* Planner */
    case 'select-day': state.week.selectedIndex = +value; renderPlanner(); break;
    case 'start-workout-from-planner': startWorkoutFor(state.week.selectedIndex); break;
    case 'move-ex-up': {
      const i = +value; if(i>0){ const arr = sessionTemplates[state.week.days[state.week.selectedIndex].label]; [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; renderPlanner(); }
      break;
    }
    case 'move-ex-down': {
      const i = +value; const arr = sessionTemplates[state.week.days[state.week.selectedIndex].label];
      if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; renderPlanner(); }
      break;
    }
    case 'move-tomorrow': {
      const wk = state.week; const i = wk.selectedIndex; const j = (i+1)%wk.days.length;
      const tmp = wk.days[i].label; wk.days[i].label = wk.days[j].label; wk.days[j].label = tmp;
      toast('Séance déplacée à demain', 'sync_alt'); renderPlanner();
      break;
    }
    case 'open-edit-session':
      openModal(`<h3 class="font-headline-md text-headline-md text-on-surface mb-element-margin">Modifier la séance</h3>
        <p class="font-body-md text-body-md text-on-surface-variant mb-card-padding">Utilise les flèches ↑↓ sur chaque exercice pour réordonner ta séquence d'exécution. D'autres options (édition des séries/reps) arrivent bientôt.</p>
        <button data-action="modal-cancel" class="w-full py-widget-padding rounded-lg bg-primary text-on-primary font-label-md font-semibold">Compris</button>`);
      break;
    case 'sync-agenda': toast('Agenda synchronisé avec succès', 'event_available'); break;
    case 'export-ics': {
      const wk = state.week;
      const NL = String.fromCharCode(13,10);
      let ics = 'BEGIN:VCALENDAR' + NL + 'VERSION:2.0' + NL + 'PRODID:-//EVOLIFT//FR' + NL;
      wk.days.forEach((d,i)=>{
        if(!sessionTemplates[d.label] || !sessionTemplates[d.label].length) return;
        ics += 'BEGIN:VEVENT' + NL + 'SUMMARY:EVOLIFT - ' + d.label + NL + 'DESCRIPTION:' + sessionTemplates[d.label].map(e=>e.name).join(', ') + NL + 'DTSTART:20260901T170000Z' + NL + 'DTEND:20260901T180000Z' + NL + 'END:VEVENT' + NL;
      });
      ics += 'END:VCALENDAR';
      download('evolift-planning.ics', ics, 'text/calendar');
      toast('Fichier .ics exporté', 'download');
      break;
    }
    case 'open-add-day': toast('Édition de cycle personnalisé — bientôt disponible', 'construction'); break;

    /* Settings */
    case 'set-increment': state.settings.increment = +value; toast('Incrément réglé sur ' + value + ' kg'); renderSettings(); break;
    case 'rest-auto-minus': state.settings.restAuto = Math.max(15, state.settings.restAuto-15); renderSettings(); break;
    case 'rest-auto-plus': state.settings.restAuto += 15; renderSettings(); break;
    case 'toggle-rpe': state.settings.rpe = !state.settings.rpe; renderSettings(); break;
    case 'toggle-offline': state.settings.offline = !state.settings.offline; renderSettings(); break;
    case 'set-unit': state.settings.unit = value; renderSettings(); renderHome(); renderWorkout(); break;
    case 'toggle-device': {
      const d = state.settings.devices[+value];
      d.status = d.status === 'connected' ? 'pair' : 'connected';
      toast(d.status==='connected' ? d.name + ' connecté' : d.name + ' déconnecté', 'bluetooth');
      renderSettings();
      break;
    }
    case 'export-json': {
      download('evolift-seances.json', JSON.stringify({log: state.workout.log, monthly: state.monthly}, null, 2), 'application/json');
      toast('Export JSON généré', 'download');
      break;
    }
    case 'logout': openConfirm('Se déconnecter ?', 'Tu devras te reconnecter pour accéder à tes données EVOLIFT.', 'Déconnexion', 'do-logout', true); break;
    case 'do-logout': closeModal(); currentEmail = null; showLogin(); toast('Déconnecté. À bientôt !', 'logout'); break;
    case 'reset-stats': openConfirm('Réinitialiser les statistiques ?', 'Cette action supprimera définitivement tes records et ton historique de séances.', 'Réinitialiser', 'do-reset', true); break;
    case 'do-reset':
      state.monthly = { sessions:0, sessionsGoal:20, tonnage:0, streak:0, prsRecent:0 };
      state.workout.log = [];
      closeModal(); renderAll(); toast('Statistiques réinitialisées', 'restart_alt');
      break;

    case 'modal-cancel': closeModal(); break;
    case 'modal-backdrop': closeModal(); break;
    case 'modal-noop': break;
  }
});

/* ============ INIT ============ */
renderAll();
initAuthUI();
showLogin();
})();
</script>
